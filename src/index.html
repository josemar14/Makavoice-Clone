<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <title>🎙️ Makavoice - Voice Cloning & TTS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
    .container{max-width:800px;margin:0 auto;padding:20px}
    header{text-align:center;padding:40px 20px;border-bottom:1px solid #1e293b}
    h1{font-size:2.5em;margin-bottom:10px}.subtitle{font-size:1.1rem;color:#cbd5e1}
    .step{background:#1e293b;padding:30px;margin:20px 0;border-radius:12px;border-left:4px solid #0ea5e9}
    button{background:#0ea5e9;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:16px;margin:10px 5px 10px 0}
    button:hover{background:#0284c7}button:disabled{opacity:.55;cursor:not-allowed}
    input,textarea{background:#0f172a;color:#e2e8f0;border:1px solid #334155;padding:12px;border-radius:8px;width:100%;margin:10px 0;font-size:16px}
    textarea{min-height:120px;resize:vertical}.success{color:#10b981}.error{color:#ef4444}.muted{color:#94a3b8;font-size:.9rem;margin-top:8px}
    .badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#334155;margin-top:12px;font-size:.85rem}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎙️ Makavoice</h1>
      <p class="subtitle">Voice Cloning & Text-to-Speech</p>
      <div class="badge">IA de voz • Cloudflare • Cartesia</div>
    </header>

    <div class="step">
      <h2>Step 1: Gravar sua Voz</h2>
      <p class="muted">Use uma gravação limpa, sem música ou outras pessoas falando.</p>
      <button id="startBtn" onclick="startRecording()">🎤 Iniciar Gravação</button>
      <button id="stopBtn" onclick="stopRecording()" disabled>⏹️ Parar</button>
      <p id="recordStatus"></p>
    </div>

    <div class="step">
      <h2>Step 2: Clonar Voz com IA</h2>
      <input id="voiceName" value="Minha Voz Makavoice" maxlength="100" aria-label="Nome da voz">
      <button id="cloneBtn" onclick="cloneVoice()">🤖 Criar Clone de Voz</button>
      <p id="cloneStatus"></p>
    </div>

    <div class="step">
      <h2>Step 3: Sintetizar Áudio</h2>
      <textarea id="textInput" maxlength="10000" placeholder="Digite o texto que deseja falar com sua voz clonada..."></textarea>
      <button id="synthBtn" onclick="synthesize()">🎵 Criar Áudio com Minha Voz</button>
      <p id="synthesisStatus"></p>
    </div>

    <div class="step">
      <h2>Step 4: Ouvir e Baixar</h2>
      <audio id="audioPlayer" controls style="width:100%;margin:10px 0"></audio>
      <button id="downloadBtn" onclick="downloadAudio()" disabled>⬇️ Baixar MP3</button>
    </div>
  </div>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedBlob = null;
    let voiceId = localStorage.getItem('makavoice_voice_id') || null;
    let generatedAudioUrl = null;

    function setStatus(id, message, type='') {
      document.getElementById(id).innerHTML = type ? `<span class="${type}">${message}</span>` : message;
    }

    function chooseMimeType() {
      const types = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
      return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = chooseMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          setStatus('recordStatus', '✅ Voz gravada com sucesso!', 'success');
          document.getElementById('cloneBtn').disabled = false;
        };
        mediaRecorder.start();
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        setStatus('recordStatus', '🔴 Gravando... Fale naturalmente por pelo menos 20–30 segundos.');
      } catch (e) {
        setStatus('recordStatus', '❌ Não foi possível acessar o microfone. Permita o acesso e tente novamente.', 'error');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    async function cloneVoice() {
      if (!recordedBlob) {
        setStatus('cloneStatus', '❌ Grave sua voz primeiro!', 'error');
        return;
      }
      const button = document.getElementById('cloneBtn');
      button.disabled = true;
      setStatus('cloneStatus', '⏳ Enviando sua gravação para criar o clone de voz...');
      try {
        const form = new FormData();
        form.append('file', recordedBlob, 'makavoice-sample.webm');
        form.append('name', document.getElementById('voiceName').value.trim() || 'Minha Voz Makavoice');
        const response = await fetch('/api/voice/clone?provider=cartesia', { method: 'POST', body: form });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.details || data.error || `Erro HTTP ${response.status}`);
        voiceId = data.voice_id;
        localStorage.setItem('makavoice_voice_id', voiceId);
        setStatus('cloneStatus', `✅ Clone de voz criado com Cartesia! ID: ${voiceId}`, 'success');
      } catch (error) {
        setStatus('cloneStatus', `❌ ${error.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function synthesize() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) { setStatus('synthesisStatus', '❌ Digite algum texto!', 'error'); return; }
      if (!voiceId) { setStatus('synthesisStatus', '❌ Crie o clone de voz primeiro!', 'error'); return; }
      const button = document.getElementById('synthBtn');
      button.disabled = true;
      setStatus('synthesisStatus', '⏳ Gerando áudio com sua voz clonada...');
      try {
        const response = await fetch('/api/voice/synthesize?provider=cartesia', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ voice_id: voiceId, text })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.details || data.error || `Erro HTTP ${response.status}`);
        }
        const audioBlob = await response.blob();
        if (generatedAudioUrl) URL.revokeObjectURL(generatedAudioUrl);
        generatedAudioUrl = URL.createObjectURL(audioBlob);
        const player = document.getElementById('audioPlayer');
        player.src = generatedAudioUrl;
        player.load();
        await player.play().catch(() => {});
        document.getElementById('downloadBtn').disabled = false;
        setStatus('synthesisStatus', '✅ Áudio gerado pelo Cartesia com sua voz clonada!', 'success');
      } catch (error) {
        setStatus('synthesisStatus', `❌ ${error.message}`, 'error');
      } finally { button.disabled = false; }
    }

    function downloadAudio() {
      if (!generatedAudioUrl) return;
      const a = document.createElement('a');
      a.href = generatedAudioUrl; a.download = 'makavoice-voz-clonada.mp3'; a.click();
    }

    if (voiceId) setStatus('cloneStatus', '✅ Um clone de voz já está salvo neste navegador. Você pode gerar novo áudio.','success');
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  </script>
</body>
</html>
